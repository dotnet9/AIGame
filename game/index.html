<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FB0">
<title>词宠岛 WordPet Island · 阳光农场</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<!-- 加载屏 -->
<div id="loading">
  <div class="loading-egg">🥚</div>
  <div class="loading-text">词宠岛正在靠岸…</div>
</div>

<!-- 任务指引横幅 -->
<div id="quest">🎯 <span id="quest-text">走近一颗发光的蛋，读出单词！</span></div>

<!-- HUD -->
<div id="hud">
  <div id="hud-left">
    <div id="pet-count" class="pill">🐾 词宠 0/36</div>
    <div id="hungry-pill" class="pill warn hidden">🍖 有词宠想你啦</div>
  </div>
  <div id="hud-right">
    <button id="btn-book" class="round-btn" title="课本朗读练习">📚</button>
    <button id="btn-map" class="round-btn" title="农场地图">🗺️</button>
    <button id="btn-summon" class="round-btn" title="召唤词宠帮忙">🪄</button>
    <button id="btn-help" class="round-btn" title="帮助">❓</button>
    <button id="btn-catalog" class="round-btn" title="词宠图鉴">📖</button>
  </div>
</div>

<!-- 触屏摇杆（手机上显示） -->
<div id="joy" class="hidden"><div id="joy-knob"></div></div>

<!-- 交互提示 -->
<div id="prompt" class="hidden"><span id="prompt-key">E</span><span id="prompt-text"></span></div>

<!-- 挑战弹窗（孵化 / 喂养） -->
<div id="modal" class="overlay hidden">
  <div id="modal-card">
    <div id="modal-head">
      <span id="modal-title">遇见词宠蛋！</span>
      <button id="modal-close" class="round-btn small">✕</button>
    </div>
    <div id="word-display">
      <div id="word-en">cat</div>
      <div id="word-zh">小猫</div>
      <div id="word-hint"></div>
    </div>
    <div id="voice-area">
      <button id="btn-play">🔊 听一听</button>
      <button id="btn-mic">🎤<span id="mic-label">点我开始读</span></button>
      <div id="voice-feedback"></div>
    </div>
    <!-- 发音评分 -->
    <div id="score-panel" class="hidden">
      <div id="score-ring"><div id="score-num">0</div><div id="score-unit">分</div></div>
      <div id="score-stars"></div>
      <div id="score-msg"></div>
    </div>
    <div id="spell-area" class="hidden">
      <div id="spell-title">用字母块拼出它：</div>
      <div id="spell-slots"></div>
      <div id="spell-tiles"></div>
      <div id="spell-actions">
        <button id="btn-replay-letters">🔊 字母发音</button>
        <button id="btn-show-help-word">💡 提示一下</button>
      </div>
    </div>
    <div id="modal-foot">
      <button id="btn-skip" class="hidden">下一个 →</button>
      <button id="btn-switch-spell">🧩 换成拼字母块</button>
    </div>
  </div>
</div>

<!-- 召唤选择 -->
<div id="picker" class="overlay hidden">
  <div id="picker-card">
    <div id="picker-title">召唤一只词宠来帮忙：</div>
    <div id="picker-grid"></div>
    <button id="picker-close" class="round-btn small">✕</button>
  </div>
</div>

<!-- 图鉴 -->
<div id="catalog" class="overlay hidden">
  <div id="catalog-card">
    <div id="catalog-head">
      <span>📖 词宠图鉴</span>
      <button id="catalog-close" class="round-btn small">✕</button>
    </div>
    <div id="catalog-grid"></div>
  </div>
</div>

<!-- 农场地图 -->
<div id="map" class="overlay hidden">
  <div id="map-card">
    <div id="map-head">
      <span>🗺️ 词宠岛地图</span>
      <button id="map-close" class="round-btn small">✕</button>
    </div>
    <canvas id="map-canvas" width="340" height="340"></canvas>
    <div id="map-legend">🔵 你在这里 · ⬤ 待孵化的词宠蛋 · 🔒 需要特殊词宠帮忙才能进入</div>
  </div>
</div>

<!-- 开场引导 -->
<div id="intro" class="overlay hidden">
  <div id="intro-card">
    <div id="intro-emoji">🥚</div>
    <div id="intro-text"></div>
    <button id="intro-next">好呀！</button>
  </div>
</div>

<!-- 提示气泡 -->
<div id="toast" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
